<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background-color: #4a6fa5; color: white; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>Class Timetable</h1>
    <table>
        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
            <th>Classroom</th>
        </tr>
        {% for slot in slots %}
        <tr>
            <td>{{ slot.day }}</td>
            <td>{{ slot.start_time|time:"h:i A" }} - {{ slot.end_time|time:"h:i A" }}</td>
            <td>{{ slot.subject_name }}</td>
            <td>{{ slot.faculty_name }}</td>
            <td>{{ slot.classroom }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No timetable records available.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
